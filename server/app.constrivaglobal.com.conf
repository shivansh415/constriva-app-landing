# app.constrivaglobal.com: static landing page. HTTPS is added and renewed by Certbot.
server {
    listen 80;
    listen [::]:80;
    server_name app.constrivaglobal.com;
    root /var/www/constriva-landing/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/ld+json application/manifest+json application/xml text/plain text/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    error_page 404 /404.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location /img/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location = /version.txt { add_header Cache-Control "no-store"; }
    location ~ /\.(?!well-known) { deny all; }
    location / {
        expires 5m;
        try_files $uri $uri/ =404;
    }
}
